name: Apply calculator update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact calculator update
        shell: python
        run: |
          from pathlib import Path
          import base64
          import hashlib

          EXPECTED_OLD_BLOB = "45a8ab14f03975477259612b77fa011aa1817a13"
          EXPECTED_NEW_BLOB = "6ee654b27daf4bbc1ee9ede4c39231bda00fb1dc"
          MARKER = b"// FIX 2 + FIX 4: multi rows with separate diam/thick and all 4 types"
          END_MARKER = b"calculate();"
          SEGMENT_B64 = ""

          def git_blob_sha(data: bytes) -> str:
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()

          path = Path("index.html")
          data = path.read_bytes()
          current_blob = git_blob_sha(data)
          if current_blob not in {EXPECTED_OLD_BLOB, EXPECTED_NEW_BLOB}:
              raise SystemExit(f"Refusing unexpected index.html blob: {current_blob}")

          if current_blob == EXPECTED_OLD_BLOB:
              start = data.index(MARKER)
              end = data.index(END_MARKER, start)
              replacement = base64.b64decode(SEGMENT_B64)
              updated = data[:start] + replacement + data[end:]
              actual_new = git_blob_sha(updated)
              if actual_new != EXPECTED_NEW_BLOB:
                  raise SystemExit(f"Generated blob mismatch: {actual_new}")
              path.write_bytes(updated)

          workflow = Path(".github/workflows/apply-calculator-update.yml")
          if workflow.exists():
              workflow.unlink()
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Update cylinder calculator"
          git push origin HEAD:main
